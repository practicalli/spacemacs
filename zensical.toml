repo = "lucide/book-open-text"

# ----------------------------------------------------------------------------
# Font Family to use when generating the website
# Fonts are loaded from Google Fonts by default
[project.theme.font]
text = "Ubuntu"
code = "Ubuntu Mono"

# Custom Admonition icons
